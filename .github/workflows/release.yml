# Release workflow for Atech Atelier (public repository).
#
# On a tag v*, build the Linux x86_64 AppImage and the macOS disk images
# (Apple silicon and Intel, branding/build_macos.sh, from FreeCAD's own
# macOS DMGs pinned in branding/upstream.env), then publish all of them with
# ONE SHA256SUMS (install.sh verifies every download against it).
#
# macOS signing: with the repository secrets MACOS_SIGN_P12_BASE64,
# MACOS_SIGN_P12_PASSWORD and MACOS_SIGN_IDENTITY ("Developer ID
# Application: ..."), the apps are signed with that Developer ID; with
# APPLE_ID, APPLE_TEAM_ID and APPLE_APP_PASSWORD as well, the disk images
# are notarized by Apple and stapled, so a browser download opens without a
# Gatekeeper warning. Without them the apps are ad-hoc signed: install.sh
# installs them (it checks SHA256SUMS and the signature's integrity), a
# browser download is blocked by Gatekeeper. The job says which it did.
#
# The Linux AppImage is built from:
#   - the official FreeCAD 1.1.3 AppImage, downloaded by URL and checked
#     against a pinned sha256 (the same pin as branding/upstream.env and
#     CREDITS.md; the job fails if the three disagree),
#   - appimagetool, downloaded by URL and checked against a pinned sha256,
#   - this repository (addon, branding, brand generators, module models).
# Then upload the AppImage, its .zsync (only when update information is set,
# see ATECH_UPDATE_INFO below) and SHA256SUMS to a DRAFT GitHub release. A
# person reviews and publishes the draft; this workflow never publishes.
#
# Values marked TODO-VERIFY were not measurable when this file was written
# (no network access). The "Refuse unverified pins" step fails the job while
# any remain, so a release cannot be built on a guessed checksum.
#
# Copied from tools/release/public/release.yml in the private source
# repository by tools/release/export_public.sh. Edit it there, not here.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the draft release and upload its assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # FreeCAD 1.1.3, from CREDITS.md ("Upstream image") and branding/upstream.env.
  FREECAD_URL: https://github.com/FreeCAD/FreeCAD/releases/download/1.1.3/FreeCAD_1.1.3-Linux-x86_64-py311.AppImage
  FREECAD_SHA256: 3a853eb69ee595f779f2255dbf80a765926981d8ff68903cefee4dfb03a8f5ef
  FREECAD_COMMIT: 145529fe741292ff0b3977a01195bf0247425794
  # appimagetool (https://github.com/AppImage/appimagetool). Pin a tagged
  # release, not "continuous": the continuous asset changes under the same URL.
  # Measured 2026-10-04: release 1.9.1 asset, 15092216 bytes; the binary
  # reports "continuous build 296, git 8c8c91f".
  APPIMAGETOOL_VERSION: "1.9.1"
  APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
  APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
  # AppImage update information. Empty means no update channel and no .zsync
  # (owner decision). To turn it on, set the repository variable
  # ATECH_UPDATE_INFO, for example
  #   gh-releases-zsync|<owner>|<repo>|latest|<AppImage name glob>.zsync
  ATECH_UPDATE_INFO: ${{ vars.ATECH_UPDATE_INFO }}
  # Licence of Atech's own code, stamped into the AppStream metainfo.
  ATECH_PROJECT_LICENSE: LGPL-3.0-or-later
  # Contact for written source requests in SOURCE_OFFER.txt (owner decision).
  ATECH_SOURCE_CONTACT: ${{ vars.ATECH_SOURCE_CONTACT }}
  # The module models live in this repository under models/.
  ATECH_ARTIFACTS: ${{ github.workspace }}

jobs:
  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the build stamps the release date from the tagged commit

      - name: Refuse unverified pins
        run: |
          bad="$(env | grep -E '^(FREECAD|APPIMAGETOOL)_' | grep 'TODO-VERIFY' || true)"
          if [ -n "$bad" ]; then
            echo "::error::release pins still say TODO-VERIFY:"; echo "$bad"; exit 1
          fi

      - name: Tag matches VERSION
        run: |
          # The build reads the version through release_meta.py; so does this.
          want="v$(python3 branding/release_meta.py version)"
          [ "$GITHUB_REF_NAME" = "$want" ] || {
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION ($want)"; exit 1; }

      - name: Pins agree with branding/upstream.env and CREDITS.md
        run: |
          . branding/upstream.env
          [ "$UPSTREAM_URL" = "$FREECAD_URL" ] || { echo "::error::URL differs from upstream.env"; exit 1; }
          [ "$UPSTREAM_SHA256" = "$FREECAD_SHA256" ] || { echo "::error::sha256 differs from upstream.env"; exit 1; }
          [ "$FREECAD_COMMIT" = "${{ env.FREECAD_COMMIT }}" ] || { echo "::error::commit differs from upstream.env"; exit 1; }
          grep -q "$FREECAD_SHA256" CREDITS.md || { echo "::error::CREDITS.md does not name the pinned sha256"; exit 1; }
          grep -q "$FREECAD_COMMIT" CREDITS.md || { echo "::error::CREDITS.md does not name the pinned commit"; exit 1; }

      - name: Install build tools
        # zsync provides zsyncmake, which appimagetool may call to write the
        # .zsync when update information is set (harmless otherwise).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            inkscape patch desktop-file-utils appstream zsync \
            python3-numpy python3-pil python3-scipy python3-yaml
          python3 -c "import numpy, PIL, scipy, yaml; print('python deps OK')"

      - name: Download FreeCAD 1.1.3 (pinned)
        run: |
          mkdir -p "$RUNNER_TEMP/in"
          curl -fL --retry 3 -o "$RUNNER_TEMP/in/freecad.AppImage" "$FREECAD_URL"
          echo "$FREECAD_SHA256  $RUNNER_TEMP/in/freecad.AppImage" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/in/freecad.AppImage"

      - name: Download appimagetool (pinned)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fL --retry 3 -o "$RUNNER_TEMP/appimagetool.AppImage" "$APPIMAGETOOL_URL"
          echo "$APPIMAGETOOL_SHA256  $RUNNER_TEMP/appimagetool.AppImage" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/appimagetool.AppImage"
          # No FUSE on hosted runners: run the tool from its extracted self.
          printf '#!/bin/sh\nAPPIMAGE_EXTRACT_AND_RUN=1 exec "%s" "$@"\n' \
            "$RUNNER_TEMP/appimagetool.AppImage" > "$RUNNER_TEMP/bin/appimagetool"
          chmod +x "$RUNNER_TEMP/bin/appimagetool"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build the AppImage
        run: |
          # build_appimage.sh only runs the upstream image with
          # --appimage-extract, which needs no FUSE.
          mkdir -p out
          name="$(python3 branding/release_meta.py outname x86_64)"
          bash branding/build_appimage.sh \
            -i "$RUNNER_TEMP/in/freecad.AppImage" \
            --build-dir "$RUNNER_TEMP/build" \
            --artifacts "$ATECH_ARTIFACTS" \
            -o "out/$name"
          echo "APPIMAGE_NAME=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: out/
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag matches VERSION
        run: |
          want="v$(python3 branding/release_meta.py version)"
          [ "$GITHUB_REF_NAME" = "$want" ] || {
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION ($want)"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python deps for the brand generators
        run: python -m pip install numpy pillow scipy pyyaml

      - name: Developer ID (when the secrets are set)
        env:
          P12: ${{ secrets.MACOS_SIGN_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$P12" ] || [ -z "$IDENTITY" ]; then
            echo "::warning::no Developer ID secrets: the macOS app is ad-hoc signed and not notarized"
            exit 0
          fi
          kc="$RUNNER_TEMP/atech-sign.keychain-db"
          kcpw="$(uuidgen)"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          echo "ATECH_MAC_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
            xcrun notarytool store-credentials atech-notary --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$kc"
            echo "ATECH_NOTARY_PROFILE=atech-notary" >> "$GITHUB_ENV"
          else
            echo "::warning::no notarization secrets: the disk image is signed but not notarized"
          fi

      - name: Build the macOS app and disk image
        # build_macos.sh downloads the pinned FreeCAD DMG for this arch and
        # refuses it unless its sha256 matches branding/upstream.env and the
        # app inside carries the FreeCAD Project Association's signature.
        # --brand-from-repo: the logo trace gate needs Inkscape and already
        # runs in the Linux job; the SVGs it guards are the committed ones.
        run: |
          mkdir -p out
          name="$(python3 branding/release_meta.py dmgname ${{ matrix.arch }})"
          bash branding/build_macos.sh --arch ${{ matrix.arch }} --brand-from-repo \
            --artifacts "$ATECH_ARTIFACTS" --build-dir "$RUNNER_TEMP/build" -o "out/$name"
          rm -f out/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: out/
          if-no-files-found: error

  release:
    needs: [appimage, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: SHA256SUMS (every platform, one file)
        working-directory: out
        run: |
          rm -f SHA256SUMS
          ls -la
          if ! ls *.zsync >/dev/null 2>&1; then
            echo "::warning::no .zsync: ATECH_UPDATE_INFO is not set, so the AppImage has no update channel"
          fi
          files="$(ls *.AppImage *.AppImage.zsync *.dmg 2>/dev/null | tr '\n' ' ')"
          sha256sum $files > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS
          echo "RELEASE_FILES=$files SHA256SUMS" >> "$GITHUB_ENV"

      - name: Draft release
        working-directory: out
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Atech Atelier $GITHUB_REF_NAME (preview)."
            echo
            echo "Install (macOS and Linux):"
            echo
            echo '    curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash'
            echo
            echo "Or download the file for your computer: the .dmg for macOS (arm64 = Apple silicon,"
            echo "x86_64 = Intel), the .AppImage for Linux x86_64."
            echo
            echo "Built from the official FreeCAD 1.1.3 releases (FreeCAD's program files unmodified),"
            echo "FreeCAD commit $FREECAD_COMMIT."
            echo
            echo "Code: LGPL-3.0-or-later, credit Atech and FreeCAD (LICENSE, LICENSE-ATTRIBUTION.md). Module models: CC BY-NC 4.0 (LICENSE-models.md)."
            echo "Verify a download with: sha256sum -c SHA256SUMS --ignore-missing"
            echo "(macOS: shasum -a 256 -c SHA256SUMS --ignore-missing)"
            echo
            echo "See CHANGELOG.md for what changed."
          } > notes.md
          # A release published by hand (from a tested local build) is never
          # touched: the CI build would replace tested assets with untested ones.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Atech Atelier $GITHUB_REF_NAME" --notes-file notes.md \
            $RELEASE_FILES
