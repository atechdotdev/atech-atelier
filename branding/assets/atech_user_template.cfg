<?xml version="1.0" encoding="UTF-8" standalone="no" ?>
<!--
  Atech Atelier — default user parameters (first run only).

  Loaded by App::Application when no user settings exist yet, via the
  branding.xml <UserParameterTemplate> key (Application.cpp:3314). It seeds the
  profile; the user may change anything afterwards and we never overwrite it.

  This file exists because branding ALONE does not win: setStyleSheet() reads
  the user's MainWindow/StyleSheet preference FIRST and only falls back to the
  branding value when that is empty (StartupProcess.cpp:533). The first-run
  wizard writes that preference, so without this template the branded theme is
  overridden the moment the user clicks a theme card.

  MEASURED 2026-09-24 — docs/verification/2026-09-24_atech_studio_branding.md
-->
<FCParameters>
  <FCParamGroup Name="Root">
    <FCParamGroup Name="BaseApp">
      <FCParamGroup Name="Preferences">

        <FCParamGroup Name="General">
          <!-- Open in our workbench, not Part Design. -->
          <FCText Name="AutoloadModule">AcadAgentWorkbench</FCText>
        </FCParamGroup>

        <FCParamGroup Name="MainWindow">
          <!-- LIGHT is the seeded default, matching the website: ThemeContext
               initialises to 'light' when localStorage is empty
               (frontend/src/lib/contexts/ThemeContext.tsx). A user who has
               atech.dev open in a browser should not meet a dark desktop app.
               Switch by setting StyleSheet to AtechDark.qss.

               This IS a real .qss now, not the upstream sheet: two generated
               sheets are the only way to ship both modes, since branding.xml
               can name exactly one and only as a fallback. Both are generated
               from brand/tokens.py — see brand/tools/build_qss.py. -->
          <FCText Name="StyleSheet">AtechLight.qss</FCText>
          <FCText Name="Theme">Atech Atelier Light</FCText>
          <!-- The overlay panels (Tasks over the 3D view) take a SEPARATE
               sheet from the "overlay:" search path. Upstream's fills a
               checked title button with the accent, a solid green square
               (release PRD R88); ours is generated from brand/tokens.py by
               brand/tools/build_qss.py and resolves @Tokens per theme, so
               one file serves both modes. -->
          <FCText Name="OverlayActiveStyleSheet">Atech Overlay.qss</FCText>
        </FCParamGroup>

        <FCParamGroup Name="Themes">
          <!-- RGBA-packed uint32 (verified against FreeCAD's own values).
               GENERATED by brand/tools/build_template.py from brand/tokens.py.

               The previous values here were #5AA2FF and #9A6BFF, described in
               this file as "the Atech gradient". They were not: neither colour
               appears anywhere in the atech.dev frontend. The real accent is
               the first stop of the site's only gradient, #0FF2B2, darkened
               for the light background it now sits on. -->
          <FCUInt Name="ThemeAccentColor1" Value="ACCENT1"/>
          <FCUInt Name="ThemeAccentColor2" Value="ACCENT2"/>
          <FCUInt Name="ThemeAccentColor3" Value="ACCENT3"/>
        </FCParamGroup>

        <FCParamGroup Name="Mod">
          <FCParamGroup Name="Start">
            <!-- Skip the first-run theme wizard. It asks the user to choose a
                 FreeCAD theme, which silently replaces the branding, and it
                 greets them with the ExeName slug. A branded product should
                 not ship a setup screen for the brand it just set. -->
            <FCBool Name="FirstStart2024" Value="0"/>
          </FCParamGroup>
        </FCParamGroup>

      </FCParamGroup>

      <FCParamGroup Name="MainWindow">
        <FCParamGroup Name="DockWindows">
          <FCParamGroup Name="OverlayRight">
            <!-- The right overlay panel (Tasks) starts OPAQUE. Upstream
                 defaults it transparent (OverlayWidgets.cpp, restore():
                 GetBool("Transparent", dockArea == Right)); then every child
                 is WA_NoSystemBackground, no stylesheet can give the panel a
                 ground, and the 3D view's axis labels show through between
                 task boxes (release PRD R88, the "stray x"). Reversible: the
                 eye button in the panel's title bar toggles it. -->
            <FCBool Name="Transparent" Value="0"/>
          </FCParamGroup>
        </FCParamGroup>
      </FCParamGroup>
    </FCParamGroup>
  </FCParamGroup>
</FCParameters>
