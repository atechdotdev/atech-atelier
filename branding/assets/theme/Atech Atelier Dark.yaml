# Atech Atelier Dark — theme parameters for FreeCAD 1.1's parametrized stylesheet.
#
# GENERATED by brand/tools/build_theme.py from brand/tokens.py.
# DO NOT EDIT: the next build overwrites it. Change brand/tokens.py.
#
# This is NOT a hand-written stylesheet. FreeCAD 1.1 migrated to a token
# system: Gui/Stylesheets/FreeCAD.qss is the (upstream, unmodified) sheet,
# and this YAML supplies the colours it resolves via
# replaceVariablesInQss(). Branding through tokens means we inherit every
# upstream widget fix for free and cannot break a dialog we never tested.
#
# Derived from upstream "FreeCAD Dark.yaml".
#
# ELEVATION RAMP IS PINNED, NOT DERIVED — carried over deliberately.
# lighten()/darken() map to QColor::lighter()/darker(), which scale HSV
# *value* MULTIPLICATIVELY (Gui/StyleParameters/Parser.cpp), so every
# derived token is proportional to PrimaryColor's V. MEASURED on the
# previous dark palette: button face contrast 1.13 vs bg (upstream gets
# 1.27), ActiveTab-vs-InActiveTab 1.01 — a selection conveying nothing —
# and GeneralBorderColor derived DARKER than the background, so borders did
# not render at all. Raised planes are explicit hex on the Atech surfaces.
#
# Installed to <AppHomePath>/share/Gui/Stylesheets/parameters/ by
# branding/build_appimage.sh; selected via the MainWindow/Theme preference.

3DViewBackgroundRefColor: "@BackgroundColor"
ButtonBackgroundHooverColor: "@ButtonTopBackgroundColor"
ButtonBorderColor: "@GeneralBorderColor"
ButtonBorderHooverColor: "@GeneralBorderColor"
ButtonBottomBackgroundColor: "@PrimaryColorLighten2"
ButtonTopBackgroundColor: "@PrimaryColorLighten3"
CheckedButtonBottomBackgroundColor: "darken(@ButtonBottomBackgroundColor, 5)"
CheckedButtonTopBackgroundColor: "darken(@ButtonTopBackgroundColor, 5)"
DefaultButtonBottomBackgroundColor: "blend(@ButtonBottomBackgroundColor, @AccentColor, 10)"
DefaultButtonTopBackgroundColor: "blend(@ButtonTopBackgroundColor, @AccentColor, 10)"
DefaultButtonBorderColor: "blend(@ButtonBorderColor, @AccentColor, 20)"
ToolButtonCheckedBorderColor: "@PrimaryColorLighten5"
ToolButtonCheckedBackground: "@CheckedButtonTopBackgroundColor"
CheckBoxBackgroundColor: "@TextEditFieldBackgroundColor"

AccentColor: "#0FF2B2"
AccentColor2: "#0FF2B2"
BackgroundColor: "#111111"
GeneralBorderColor: "#333333"

PrimaryColor: "#111111"
PrimaryColorLighten2: "#1F1F1F"
PrimaryColorLighten3: "#2B2B2B"
PrimaryColorLighten4: "#373737"
PrimaryColorLighten5: "#4A4A4A"

SelectionColor: "#0FF2B2"
TextEditFieldBackgroundColor: "#1A1A1A"

SketcherConflictingConstraintsColor: "#E0705F"
SketcherEmptySketchColor: "#F5F5F5"
SketcherFullyConstrainedColor: "#6BBD85"
SketcherMalformedConstraintsColor: "#E0705F"
SketcherPartiallyRedundantConstraintsColor: "#0FF2B2"
SketcherRedundantConstraintsColor: "#E0B052"
SketcherSolverFailedColor: "#E0705F"
SketcherUnderConstrainedColor: "#F5F5F5"

InActiveTabBackgroundColor: "#0D0D0D"
ActiveTabBackgroundColor: "#1F1F1F"
TextDisabledColor: "#666666"
TextForegroundColor: "#F5F5F5"
TextUrlColor: "#0FF2B2"

# --- Atech-only tokens ------------------------------------
# Not in any upstream sheet. Read by overlay/Atech Overlay.qss
# (brand/tools/qss.py OVERLAY_TOKENS), which styles the overlay
# panels' title bars in this mode's brand surfaces (release PRD R88).
AtechPanelColor: "#1A1A1A"
AtechHoverColor: "#222222"
AtechMutedColor: "#A0A0A0"
# Resting title-bar icon colour, an upstream images_classic suffix
# (qss.OVERLAY_ICON): lightgray read too faintly on dark (R118).
AtechOverlayIconColor: "white"

# --- inherited from upstream, unchanged ------------------
# Present so every @Token FreeCAD.qss references resolves. Our
# own values above are NOT overridden by this block.
CheckBoxBorderColor: "@GeneralBorderColor"
DialogBackgroundColor: "@PrimaryColorLighten3"
GeneralAlternateBackgroundColor: "@PrimaryColorLighten2"
GeneralBackgroundColor: "@PrimaryColor"
GeneralBackgroundHoverColor: "@PrimaryColorLighten4"
GeneralBorderHoverColor: "@PrimaryColorLighten6"
GeneralDisabledBackgroundColor: "@PrimaryColorDarken3"
GeneralGridLinesColor: "@PrimaryColorLighten3"
GeneralHeaderBackgroundColor: "@PrimaryColor"
GroupboxBackgroundColor: "@PrimaryColorLighten4"
GroupboxBorderColor: "lighten(@GroupboxBackgroundColor,20)"
IconsLocationFolderName: "images_classic"
InputFieldBorderRadius: "3px"
MenuBackgroundColor: "@PrimaryColorDarken4"
PrimaryColorDarken1: "darken(@PrimaryColor,5)"
PrimaryColorDarken2: "darken(@PrimaryColor,8)"
PrimaryColorDarken3: "darken(@PrimaryColor,15)"
PrimaryColorDarken4: "darken(@PrimaryColor,20)"
PrimaryColorDarken5: "darken(@PrimaryColor,200)"
PrimaryColorDarken6: "darken(@PrimaryColor,5890)"
PrimaryColorLighten1: "lighten(@PrimaryColor,20)"
PrimaryColorLighten6: "lighten(@PrimaryColor,5890)"
RadioButtonBackgroundColor: "@CheckBoxBackgroundColor"
